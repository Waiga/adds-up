name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps .
      # It has to work from a directory that is not the source tree.
      - run: cd "$RUNNER_TEMP" && adds-up --help && adds-up --list-checks
      # The examples are documented behaviour, so they are run. Exit 1 means
      # findings were reported, which is what the first three are for.
      - run: adds-up examples/volume-tiers.csv || test $? -eq 1
      - run: adds-up examples/discount-schedule.csv || test $? -eq 1
      - run: adds-up examples/rate-card.xlsx || test $? -eq 1
      - run: adds-up examples/consistent.csv
      # A run with every check switched off must not look clean.
      - run: |
          adds-up examples/volume-tiers.csv \
            --skip volume-tier --skip discount-tier --skip bundle-above-parts \
            --skip stated-discount --skip two-prices --skip inverted-range \
            --skip unit-mismatch && exit 1 || test $? -eq 2
      # Nor may a run in which a check reported that it ran but compared no
      # numbers. This file has a real inverted tier and a price column the
      # vocabulary does not know; only unit-mismatch can run, and it compares
      # text. An adversarial review found this exiting 0.
      - run: |
          printf 'SKU,Quantity,UOM,Tariff amount payable\n' > "$RUNNER_TEMP/x.csv"
          printf 'W-1,1,each,9.00\nW-1,1000,each,50.00\n' >> "$RUNNER_TEMP/x.csv"
          adds-up "$RUNNER_TEMP/x.csv" && exit 1 || test $? -eq 2
      # And a file this tool does not read must exit 2, not 1.
      - run: |
          echo "not a spreadsheet" > "$RUNNER_TEMP/x.pdf"
          adds-up "$RUNNER_TEMP/x.pdf" && exit 1 || test $? -eq 2
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
