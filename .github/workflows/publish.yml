name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the build frontend
        run: python -m pip install --disable-pip-version-check --no-input build==1.3.0

      - name: Verify the tag matches the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          module = ast.parse(Path("adds_up/__init__.py").read_text(encoding="utf-8"))
          version = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )
          expected_tag = f"v{version}"
          if os.environ["TAG_NAME"] != expected_tag:
              raise SystemExit(
                  f"Release tag {os.environ['TAG_NAME']!r} does not match {expected_tag!r}"
              )
          PY

      - name: Build the source and wheel distributions
        run: python -m build

      - name: Verify the distribution set
        run: |
          python - <<'PY'
          from pathlib import Path

          distributions = [path for path in Path("dist").iterdir() if path.is_file()]
          wheels = [path for path in distributions if path.suffix == ".whl"]
          source_distributions = [path for path in distributions if path.name.endswith(".tar.gz")]
          if len(distributions) != 2 or len(wheels) != 1 or len(source_distributions) != 1:
              names = ", ".join(sorted(path.name for path in distributions))
              raise SystemExit(f"Expected one wheel and one source distribution, found: {names}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/adds-up
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
